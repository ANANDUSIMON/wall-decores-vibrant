name: Render Vibrant Film

on:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------
  # One machine per scene, all seven in parallel — wall-clock cost is the
  # longest single scene, not the sum of all seven.
  # ---------------------------------------------------------------------
  render-scene:
    name: Render ${{ matrix.scene }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scene: [S1, S2, S3, S4, S5, S6, S7]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Cache Remotion browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: remotion-browser-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Remotion
        run: npx remotion browser ensure

      # --muted matters more than it looks: without it Remotion attaches a
      # silent AAC track that runs slightly longer than the video, and seven
      # of those concatenated drift out of sync. Video-only files concat
      # cleanly.
      - name: Render ${{ matrix.scene }}
        run: |
          mkdir -p out
          npx remotion render src/index.ts ${{ matrix.scene }} \
            out/${{ matrix.scene }}.mp4 \
            --codec h264 \
            --crf 17 \
            --x264-preset veryfast \
            --pixel-format yuv420p \
            --muted \
            --log verbose

      - uses: actions/upload-artifact@v4
        with:
          name: scene-${{ matrix.scene }}
          path: out/${{ matrix.scene }}.mp4
          retention-days: 7

  # ---------------------------------------------------------------------
  # Join the seven scenes in order, crossfading over the 6-frame overlap
  # each pair shares in src/Film.tsx so the cut matches the combined Film
  # composition instead of hard-cutting.
  # ---------------------------------------------------------------------
  concat:
    name: Join scenes into final film
    needs: render-scene
    runs-on: ubuntu-latest
    steps:
      # The runner image does not always carry ffmpeg, and the concat/ffprobe
      # steps fail late and confusingly when it is missing.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download all scenes
        uses: actions/download-artifact@v4
        with:
          path: scenes
          pattern: scene-*
          merge-multiple: true

      # src/Film.tsx overlaps every consecutive pair of scene Sequences by
      # exactly 6 frames (0.2s @ 30fps) — e.g. S1 (from:0, dur:150) and S2
      # (from:144, dur:180) share global frames 144-149 — so each scene
      # clip above already contains that shared window at its tail/head.
      # A straight concat would hard-cut through it; xfade blends it instead.
      # xfade can't use `-c copy`, but this re-encode only happens once, here.
      - name: Crossfade join (xfade)
        run: |
          mkdir -p out
          set -e
          FPS=30
          OVERLAP_FRAMES=6
          OVERLAP=$(awk "BEGIN{printf \"%.6f\", ${OVERLAP_FRAMES}/${FPS}}")
          IDS=(S1 S2 S3 S4 S5 S6 S7)

          INPUTS=()
          for id in "${IDS[@]}"; do
            INPUTS+=(-i "scenes/${id}.mp4")
          done

          # Read each clip's actual duration back from the file rather than
          # assuming it, so the offsets stay correct if scene lengths change.
          DURS=()
          for id in "${IDS[@]}"; do
            d=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "scenes/${id}.mp4")
            DURS+=("$d")
          done

          FILTER=""
          CUM="${DURS[0]}"
          PREV="[0]"
          for i in 1 2 3 4 5 6; do
            OFFSET=$(awk "BEGIN{printf \"%.6f\", ${CUM} - ${OVERLAP}}")
            FILTER+="${PREV}[${i}]xfade=transition=fade:duration=${OVERLAP}:offset=${OFFSET}[v${i}];"
            CUM=$(awk "BEGIN{printf \"%.6f\", ${CUM} + ${DURS[$i]} - ${OVERLAP}}")
            PREV="[v${i}]"
          done
          FILTER="${FILTER%;}"
          FINAL_LABEL="${PREV#[}"
          FINAL_LABEL="${FINAL_LABEL%]}"

          echo "--- durations (s): ${DURS[@]} ---"
          echo "--- filter_complex ---"
          echo "$FILTER"

          ffmpeg -hide_banner "${INPUTS[@]}" \
            -filter_complex "${FILTER}" \
            -map "[${FINAL_LABEL}]" \
            -c:v libx264 -crf 18 -pix_fmt yuv420p -movflags +faststart \
            out/wall-decores-vibrant-final.mp4

      - name: Report
        run: |
          ffprobe -hide_banner -v error \
            -show_entries format=duration,size \
            -show_entries stream=width,height,r_frame_rate,codec_name \
            -of default=noprint_wrappers=1 \
            out/wall-decores-vibrant-final.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: out/wall-decores-vibrant-final.mp4
          retention-days: 30
